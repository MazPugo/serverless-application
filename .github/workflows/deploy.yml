name: Deploy Serverless Application

# Deploys the SAM application (template + Lambda code) on every push to main.
on:
  push:
    branches:
      - main
  # Allow manual runs from the Actions tab as well.
  workflow_dispatch:

# Avoid overlapping deployments if multiple pushes land quickly.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Required for GitHub OIDC: the runner needs to mint an OIDC token that AWS
# exchanges for short-lived credentials. No long-lived access keys are stored.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  STACK_NAME: serverless-application
  SAM_CLI_TELEMETRY: 0

jobs:
  deploy:
    name: Build and deploy with SAM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python (required by AWS SAM CLI)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # ARN of the IAM role that trusts GitHub's OIDC provider.
          # Stored as a repo secret so it is not hardcoded. No access keys.
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-sam-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Validate SAM template
        run: sam validate --lint

      - name: SAM build (packages Lambda function code)
        run: sam build

      - name: SAM deploy (updates stack and Lambda code)
        run: >
          sam deploy
          --stack-name "$STACK_NAME"
          --region "$AWS_REGION"
          --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM
          --resolve-s3
          --no-confirm-changeset
          --no-fail-on-empty-changeset
