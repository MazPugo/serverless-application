name: Deploy Serverless Application

on:
  push:
    branches:
      - main

# Permissions block is REQUIRED to request the OIDC JWT token
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      # Authenticate securely using OIDC role assumption (no stored keys).
      # audience defaults to sts.amazonaws.com, which the role's trust policy
      # expects - do NOT set a malformed value here.
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-sam-deploy

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Build application resources
        run: sam build

      # Stack name, capabilities and artifact bucket must be passed explicitly
      # (no samconfig.toml is committed). The templates create named IAM roles,
      # so CAPABILITY_NAMED_IAM is required.
      - name: Deploy application stack
        run: >
          sam deploy
          --stack-name serverless-application
          --region us-east-1
          --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM
          --resolve-s3
          --no-confirm-changeset
          --no-fail-on-empty-changeset
